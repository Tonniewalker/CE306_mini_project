<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2a0b6b">
<title>ภาพรวม · Admin PRE-FOOD</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍱</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Prompt:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="store-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="store-main">
      <header class="store-topbar" id="store-topbar"></header>
      <main class="store-content">
        <section class="card">
          <div class="card__title" style="margin:0">Welcome, Admin!</div>
        </section>

        <section class="stat-grid stat-grid--3 mt-16" id="stats"></section>

        <section class="card mt-16">
          <div class="between" style="margin-bottom:8px">
            <div class="card__title" style="margin:0" id="appsTitle">ใบสมัครร้านค้า</div>
            <span class="count-badge" id="appsCount">0</span>
          </div>
          <div id="appsList"><div class="skeleton" style="height:80px"></div></div>
        </section>

        <section class="card mt-16">
          <div class="card__title">ร้านค้าวันนี้</div>
          <div class="table-scroll" id="storesToday"><div class="skeleton" style="height:80px"></div></div>
        </section>
      </main>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/nav.js"></script>
  <script>
    // หน้า admin: ภาพรวมระบบ
    const admin = requireAuth('admin');
    if (admin) renderAdminShell('dashboard', 'ภาพรวมระบบ');
    document.getElementById('appsTitle').insertAdjacentHTML('afterbegin', icon('store'));

    let apps = [];

    // แสดงตัวเลขภาพรวมและร้านค้าวันนี้
    function renderStats(s) {
      const stat = (emoji, bg, value, label) => `
        <div class="stat"><div class="stat__icon" style="background:${bg}">${emoji}</div>
          <div><div class="stat__value">${value}</div><div class="stat__label">${label}</div></div></div>`;
      document.getElementById('stats').innerHTML =
        stat('👥', 'var(--brand-50)', s.customers, 'ผู้ใช้ทั้งหมด') +
        stat('🍽️', 'var(--green-50)', s.stores, 'ร้านค้าที่เปิดอยู่') +
        stat('📝', 'var(--blue-50)', s.pending_applications, 'ใบสมัครรอตรวจ') +
        stat('🧾', 'var(--brand-50)', s.orders_today, 'ออเดอร์วันนี้') +
        stat('⏳', 'var(--amber-50)', s.active_orders, 'กำลังดำเนินการ') +
        stat('💰', 'var(--amber-50)', formatCurrency(s.sales_today), 'ยอดขายวันนี้');

      const state = (st) => st.status === 'suspended'
        ? '<span class="pill pill--cancelled"><span class="dot"></span>ถูกระงับ</span>'
        : st.is_accepting
          ? '<span class="pill pill--ready"><span class="dot"></span>เปิดรับออเดอร์</span>'
          : '<span class="pill pill--completed"><span class="dot"></span>ปิดรับชั่วคราว</span>';
      document.getElementById('storesToday').innerHTML = s.stores_today.length
        ? `<table class="history-table admin-table">
            <thead><tr><th>ร้าน</th><th>สถานะ</th><th>ออเดอร์วันนี้</th><th>ยอดขายวันนี้</th></tr></thead>
            <tbody>${s.stores_today.map((st) => `
              <tr><td class="bold">${escapeHtml(st.name)}</td><td>${state(st)}</td><td>${st.orders}</td><td class="bold">${formatCurrency(st.sales)}</td></tr>`).join('')}
            </tbody></table>`
        : '<p class="small muted">ยังไม่มีร้านค้า</p>';
    }

    // โหลดตัวเลขภาพรวม
    async function loadStats() {
      try {
        renderStats(await apiRequest('/admin/stats', { auth: true }));
      } catch (err) {
        toast(err.message, 'error');
      }
    }

    // แสดงใบสมัครที่รอตรวจ
    function renderApps() {
      document.getElementById('appsCount').textContent = apps.length;
      document.getElementById('appsList').innerHTML = apps.length
        ? apps.map((a) => `
            <div class="application">
              <div class="between" style="align-items:flex-start;gap:12px;flex-wrap:wrap">
                <div class="grow">
                  <div class="bold">${escapeHtml(a.store_name)}${a.food_type ? ` <span class="small muted">· ${escapeHtml(a.food_type)}</span>` : ''}</div>
                  ${a.description ? `<div class="small muted">${escapeHtml(a.description)}</div>` : ''}
                  <div class="small mt-4">${icon('user', 'icon-sm')} ${escapeHtml(a.contact_name)} · ${escapeHtml(a.phone)} · ${escapeHtml(a.email)}</div>
                  <div class="small muted">#${String(a.id).padStart(5, '0')} · ส่งเมื่อ ${escapeHtml(formatDateTime(a.created_at))}</div>
                </div>
                <div class="row" style="gap:8px">
                  <button class="btn btn--sm btn--ghost text-red" data-app="${a.id}" data-act="reject">ปฏิเสธ</button>
                  <button class="btn btn--sm btn--green" data-app="${a.id}" data-act="approve">${icon('check', 'icon-sm')}อนุมัติ</button>
                </div>
              </div>
              ${a.message ? `<div class="application__msg">💬 ${escapeHtml(a.message)}</div>` : ''}
            </div>`).join('')
        : '<p class="small muted">ไม่มีใบสมัครรอตรวจ</p>';
    }

    // โหลดใบสมัครที่รอตรวจ
    async function loadApps() {
      try {
        apps = await apiRequest('/admin/applications?status=pending', { auth: true });
        renderApps();
        loadStats();
      } catch (err) {
        toast(err.message, 'error');
      }
    }

    // อนุมัติ: ตั้งอีเมลบัญชีร้าน แล้วแสดงรหัสผ่านชั่วคราว
    function approveApp(app) {
      const modal = openModal({
        title: 'อนุมัติและสร้างบัญชีร้าน',
        body: `
          <p class="small muted">ระบบจะสร้างบัญชีร้าน <b>${escapeHtml(app.store_name)}</b> พร้อมรหัสผ่านชั่วคราว</p>
          <div id="approveAlert" hidden></div>
          <div class="field mt-12">
            <label class="label" for="ap-email">อีเมลสำหรับเข้าสู่ระบบร้าน</label>
            <input class="input" id="ap-email" type="email" value="${escapeHtml(app.email)}">
          </div>`,
        foot: `<button class="btn btn--ghost" data-close>ยกเลิก</button>
               <button class="btn btn--green" id="apOk">${icon('check', 'icon-sm')}สร้างบัญชีร้าน</button>`,
      });
      modal.el.querySelector('[data-close]').addEventListener('click', () => modal.close());
      const okBtn = modal.el.querySelector('#apOk');
      okBtn.addEventListener('click', async () => {
        okBtn.disabled = true;
        try {
          const data = await apiRequest(`/admin/applications/${app.id}/approve`, {
            method: 'POST', auth: true, body: { email: modal.el.querySelector('#ap-email').value.trim() },
          });
          modal.setTitle('สร้างบัญชีร้านแล้ว 🎉');
          modal.setBody(`
            <p>ส่งข้อมูลนี้ให้ร้าน <b>${escapeHtml(data.store_name)}</b> เพื่อเข้าสู่ระบบ</p>
            <div class="credential">
              <div>อีเมล: <code>${escapeHtml(data.email)}</code></div>
              <div class="mt-4">รหัสผ่าน: <code>${escapeHtml(data.password)}</code></div>
            </div>
            <p class="small text-red mt-12">รหัสผ่านจะแสดงครั้งเดียว กรุณาจดไว้ก่อนปิดหน้าต่าง</p>`);
          modal.setFoot('<button class="btn" data-close>ปิด</button>');
          modal.setDismissible(false);
          modal.el.querySelector('[data-close]').addEventListener('click', () => modal.close());
          loadApps();
        } catch (err) {
          showAlert(modal.el.querySelector('#approveAlert'), err.message);
          okBtn.disabled = false;
        }
      });
    }

    document.getElementById('appsList').addEventListener('click', async (e) => {
      const btn = e.target.closest('[data-app]');
      if (!btn) return;
      const app = apps.find((a) => a.id === Number(btn.dataset.app));
      if (btn.dataset.act === 'approve') return approveApp(app);
      const ok = await confirmDialog({
        title: 'ปฏิเสธใบสมัครนี้?', message: `ใบสมัครร้าน ${app.store_name} จะถูกปิด`, confirmText: 'ปฏิเสธ', danger: true,
      });
      if (!ok) return;
      try {
        await apiRequest(`/admin/applications/${app.id}/reject`, { method: 'POST', auth: true });
        toast(`ปฏิเสธใบสมัครร้าน ${app.store_name} แล้ว`);
      } catch (err) {
        toast(err.message, 'error');
      }
      loadApps();
    });

    if (admin) {
      loadApps();
      setInterval(loadApps, 15000);
    }
  </script>
</body>
</html>
