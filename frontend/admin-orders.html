<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2a0b6b">
<title>ออเดอร์ · Admin PRE-FOOD</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍱</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Prompt:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="store-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="store-main">
      <header class="store-topbar" id="store-topbar"></header>
      <main class="store-content">
        <div class="order-filters">
          <input class="input" type="date" id="date" aria-label="วันที่">
          <select class="input" id="store" aria-label="ร้าน"><option value="">ทุกร้าน</option></select>
          <div class="input-wrap admin-search">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input class="input" type="search" id="search" placeholder="ค้นหาเลขออเดอร์ หรือชื่อลูกค้า">
          </div>
        </div>
        <div class="chips mt-12" id="groups">
          <button class="chip active" data-group="">ทั้งหมด</button>
          <button class="chip" data-group="active">กำลังดำเนินการ</button>
          <button class="chip" data-group="completed">สำเร็จ</button>
          <button class="chip" data-group="failed">ยกเลิก / ไม่มารับ</button>
        </div>

        <section class="card mt-12">
          <div class="between wrap" style="margin-bottom:8px;gap:8px">
            <span class="small muted" id="summary"></span>
            <button class="btn btn--sm btn--ghost" id="allDates">ดูทุกวัน</button>
          </div>
          <div class="table-scroll" id="list"><div class="skeleton" style="height:160px"></div></div>
        </section>
      </main>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/nav.js"></script>
  <script>
    // หน้า admin: ออเดอร์ทุกร้าน
    const admin = requireAuth('admin');
    if (admin) renderAdminShell('orders', 'ออเดอร์');
    const $ = (id) => document.getElementById(id);

    // วันที่วันนี้แบบ YYYY-MM-DD
    function todayStr() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }
    $('date').value = todayStr();
    let group = '';
    let orders = [];
    let loading = 0;

    // แสดงตารางออเดอร์
    function render(data) {
      orders = data.orders;
      const when = $('date').value ? `วันที่ ${new Date(`${$('date').value}T00:00:00`).toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: '2-digit' })}` : 'ทุกวัน';
      $('summary').textContent = `${when} · ${data.total} ออเดอร์ · ยอดขาย ${formatCurrency(data.sales)}`
        + (data.total > data.limit ? ` · แสดง ${data.limit} รายการล่าสุด` : '');
      $('allDates').hidden = !$('date').value;
      $('list').innerHTML = orders.length
        ? `<table class="history-table admin-orders">
            <thead><tr><th>ออเดอร์</th><th>สั่งเมื่อ</th><th>ร้าน</th><th>ลูกค้า</th><th>รายการ</th><th>ยอด</th><th>สถานะ</th></tr></thead>
            <tbody>${orders.map((o) => `
              <tr data-id="${o.id}" tabindex="0">
                <td class="bold">#${o.id}<div class="tiny muted">คิว ${queueLabel(o.queue_number)}</div></td>
                <td class="muted">${escapeHtml(formatDateTime(o.created_at))}</td>
                <td>${escapeHtml(o.store_name || '-')}</td>
                <td>${escapeHtml(o.customer_name)}</td>
                <td class="muted admin-orders__items">${escapeHtml(o.items_text || '')}</td>
                <td class="bold">${formatCurrency(o.total_amount)}</td>
                <td>${statusPill(o.status)}</td>
              </tr>`).join('')}</tbody>
          </table>`
        : '<p class="small muted">ไม่พบออเดอร์</p>';
    }

    // โหลดออเดอร์ตามตัวกรอง
    async function load() {
      const params = new URLSearchParams();
      if ($('date').value) params.set('date', $('date').value);
      if ($('store').value) params.set('store_id', $('store').value);
      if (group) params.set('group', group);
      if ($('search').value.trim()) params.set('q', $('search').value.trim());
      const ticket = ++loading;
      try {
        const data = await apiRequest(`/admin/orders?${params}`, { auth: true });
        if (ticket === loading) render(data); // ใช้ผลของคำขอล่าสุดเท่านั้น
      } catch (err) {
        toast(err.message, 'error');
      }
    }

    // โหลดรายชื่อร้านใส่ตัวเลือก
    async function loadStores() {
      try {
        const stores = await apiRequest('/admin/stores', { auth: true });
        $('store').insertAdjacentHTML('beforeend', stores.map((s) => `<option value="${s.id}">${escapeHtml(s.name)}</option>`).join(''));
      } catch (e) { /* ใช้ตัวเลือกทุกร้าน */ }
    }

    // ป้ายคนเปลี่ยนสถานะ
    const ROLE_LABELS = { customer: 'ลูกค้า', store: 'ร้าน', admin: 'Admin' };

    // รายละเอียดออเดอร์
    async function openDetail(id) {
      let o;
      try {
        o = await apiRequest(`/orders/${id}`, { auth: true });
      } catch (err) {
        return toast(err.message, 'error');
      }
      openModal({
        title: `ออเดอร์ #${o.id} · คิว ${queueLabel(o.queue_number)}`,
        body: `
          <div class="row" style="gap:8px;flex-wrap:wrap">${statusPill(o.status)}<span class="small muted">${o.payment_status === 'refunded' ? 'คืนเงินแล้ว' : 'ชำระเงินแล้ว'}</span></div>
          <div class="small mt-12">ร้าน <b>${escapeHtml(o.store_name || '-')}</b> · ลูกค้า <b>${escapeHtml(o.customer_name)}</b></div>
          <div class="small muted">สั่ง ${escapeHtml(formatDateTime(o.created_at))} · รับ${escapeHtml(formatPickup(o.pickup_time))}</div>
          ${o.note ? `<div class="order-note mt-8">📝 ${escapeHtml(o.note)}</div>` : ''}
          ${o.cancel_reason ? `<div class="small text-red mt-8">เหตุผล: ${escapeHtml(o.cancel_reason)}</div>` : ''}
          <div class="mt-12">${o.items.map((i) => `
            <div class="sum-row"><span>${escapeHtml(i.item_name)} ×${i.quantity}</span><span>${formatCurrency(i.subtotal)}</span></div>`).join('')}
            <div class="sum-total"><span>รวม</span><strong>${formatCurrency(o.total_amount)}</strong></div>
          </div>
          <div class="bold mt-12">ประวัติสถานะ</div>
          ${o.logs.map((l) => `
            <div class="between small" style="padding:6px 0;border-top:1px solid var(--line)">
              <span>${escapeHtml(STATUS[l.status] ? STATUS[l.status].label : l.status)}${l.changed_by_role ? ` <span class="muted">· ${ROLE_LABELS[l.changed_by_role] || ''}</span>` : ''}${l.note ? `<div class="tiny muted">${escapeHtml(l.note)}</div>` : ''}</span>
              <span class="muted">${escapeHtml(formatTime(l.created_at))}</span>
            </div>`).join('')}`,
        foot: '',
      });
    }

    $('list').addEventListener('click', (e) => {
      const row = e.target.closest('tr[data-id]');
      if (row) openDetail(Number(row.dataset.id));
    });
    $('list').addEventListener('keydown', (e) => {
      const row = e.target.closest('tr[data-id]');
      if (row && e.key === 'Enter') openDetail(Number(row.dataset.id));
    });
    $('groups').addEventListener('click', (e) => {
      const chip = e.target.closest('[data-group]');
      if (!chip) return;
      group = chip.dataset.group;
      document.querySelectorAll('#groups .chip').forEach((c) => c.classList.toggle('active', c === chip));
      load();
    });
    $('date').addEventListener('change', load);
    $('store').addEventListener('change', load);
    $('allDates').addEventListener('click', () => { $('date').value = ''; load(); });
    let searchTimer = null;
    $('search').addEventListener('input', () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(load, 300);
    });

    if (admin) {
      loadStores();
      load();
      setInterval(() => { if (!document.querySelector('.modal-backdrop')) load(); }, 20000);
    }
  </script>
</body>
</html>
