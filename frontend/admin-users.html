<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2a0b6b">
<title>ผู้ใช้ · Admin PRE-FOOD</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍱</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Prompt:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="store-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="store-main">
      <header class="store-topbar" id="store-topbar"></header>
      <main class="store-content">
        <div class="between wrap" style="gap:12px">
          <div class="chips" id="filters">
            <button class="chip active" data-filter="">ทั้งหมด</button>
            <button class="chip" data-filter="active">ใช้งานได้</button>
            <button class="chip" data-filter="suspended">ถูกระงับ</button>
          </div>
          <div class="input-wrap admin-search">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input class="input" type="search" id="search" placeholder="ค้นหาชื่อ อีเมล หรือเบอร์โทร">
          </div>
        </div>

        <section class="card mt-12">
          <div class="small muted" id="summary" style="margin-bottom:8px"></div>
          <div id="list"><div class="skeleton" style="height:120px"></div></div>
        </section>
      </main>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/nav.js"></script>
  <script>
    // หน้า admin: บัญชีผู้ใช้
    const admin = requireAuth('admin');
    if (admin) renderAdminShell('users', 'ผู้ใช้');

    let users = [];
    let filter = '';

    // แสดงรายการผู้ใช้
    function render() {
      const q = document.getElementById('search').value.trim().toLowerCase();
      const list = users.filter((u) =>
        (!filter || (filter === 'active') === !!u.is_active) &&
        (!q || u.name.toLowerCase().includes(q) || u.email.toLowerCase().includes(q) || (u.phone || '').includes(q)));

      const suspended = users.filter((u) => !u.is_active).length;
      document.getElementById('summary').textContent = `ผู้ใช้ ${users.length} บัญชี${suspended ? ` · ถูกระงับ ${suspended}` : ''}`;
      document.getElementById('list').innerHTML = list.length
        ? list.map((u) => `
            <div class="admin-store">
              <span class="avatar avatar--lg">${escapeHtml(initials(u.name))}</span>
              <div style="min-width:0">
                <div class="row" style="gap:8px;flex-wrap:wrap">
                  <span class="bold">${escapeHtml(u.name)}</span>
                  ${u.is_active ? '' : '<span class="pill pill--cancelled"><span class="dot"></span>ถูกระงับ</span>'}
                </div>
                <div class="small mt-4">${escapeHtml(u.email)}${u.phone ? ` · ${escapeHtml(u.phone)}` : ''}</div>
                <div class="small muted">ออเดอร์ ${u.orders} · ใช้จ่าย ${formatCurrency(u.spent)}${u.last_order_at ? ` · สั่งล่าสุด ${escapeHtml(formatDateTime(u.last_order_at))}` : ''} · สมัคร ${escapeHtml(formatDateTime(u.created_at))}</div>
              </div>
              <div class="row admin-store__actions" style="gap:8px">
                ${u.is_active
                  ? `<button class="btn btn--sm btn--ghost text-red" data-id="${u.id}" data-active="0">ระงับบัญชี</button>`
                  : `<button class="btn btn--sm btn--green" data-id="${u.id}" data-active="1">เปิดบัญชี</button>`}
              </div>
            </div>`).join('')
        : '<p class="small muted">ไม่พบผู้ใช้</p>';
    }

    // โหลดผู้ใช้ทั้งหมด
    async function load() {
      try {
        users = await apiRequest('/admin/users', { auth: true });
        render();
      } catch (err) {
        toast(err.message, 'error');
      }
    }

    document.getElementById('list').addEventListener('click', async (e) => {
      const btn = e.target.closest('[data-active]');
      if (!btn) return;
      const user = users.find((u) => u.id === Number(btn.dataset.id));
      const active = btn.dataset.active === '1';
      const ok = await confirmDialog(active
        ? { title: `เปิดบัญชี ${user.name}?`, message: 'ผู้ใช้จะเข้าสู่ระบบและสั่งอาหารได้ตามปกติ', confirmText: 'เปิดบัญชี' }
        : { title: `ระงับบัญชี ${user.name}?`, message: 'ผู้ใช้จะถูกออกจากระบบและเข้าสู่ระบบไม่ได้ จนกว่าจะเปิดบัญชีอีกครั้ง', confirmText: 'ระงับบัญชี', danger: true });
      if (!ok) return;
      try {
        await apiRequest(`/admin/users/${user.id}/status`, { method: 'PATCH', auth: true, body: { is_active: active } });
        toast(active ? `เปิดบัญชี ${user.name} แล้ว` : `ระงับบัญชี ${user.name} แล้ว`);
      } catch (err) {
        toast(err.message, 'error');
      }
      load();
    });

    document.getElementById('filters').addEventListener('click', (e) => {
      const chip = e.target.closest('[data-filter]');
      if (!chip) return;
      filter = chip.dataset.filter;
      document.querySelectorAll('#filters .chip').forEach((c) => c.classList.toggle('active', c === chip));
      render();
    });
    document.getElementById('search').addEventListener('input', render);

    if (admin) load();
  </script>
</body>
</html>
