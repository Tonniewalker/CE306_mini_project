<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2a0b6b">
<title>ร้านค้า · Admin PRE-FOOD</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍱</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Prompt:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="store-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="store-main">
      <header class="store-topbar" id="store-topbar"></header>
      <main class="store-content">
        <div class="between wrap" style="gap:12px">
          <div class="chips" id="filters">
            <button class="chip active" data-status="">ทั้งหมด</button>
            <button class="chip" data-status="approved">เปิดให้บริการ</button>
            <button class="chip" data-status="suspended">ถูกระงับ</button>
          </div>
          <div class="input-wrap admin-search">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input class="input" type="search" id="search" placeholder="ค้นหาร้านค้า">
          </div>
        </div>

        <section class="card mt-12">
          <div id="list"><div class="skeleton" style="height:120px"></div></div>
        </section>
      </main>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/nav.js"></script>
  <script>
    // หน้า admin: ร้านค้าทั้งหมด
    const admin = requireAuth('admin');
    if (admin) renderAdminShell('stores', 'ร้านค้า');

    const STATUS_PILLS = {
      approved: '<span class="pill pill--ready"><span class="dot"></span>เปิดให้บริการ</span>',
      suspended: '<span class="pill pill--cancelled"><span class="dot"></span>ถูกระงับ</span>',
      pending: '<span class="pill pill--preparing"><span class="dot"></span>รออนุมัติ</span>',
      rejected: '<span class="pill pill--completed"><span class="dot"></span>ไม่อนุมัติ</span>',
    };
    // ปุ่มตามสถานะร้าน: [สถานะใหม่, ข้อความปุ่ม, สีแดง]
    const ACTIONS = {
      approved: [['suspended', 'ระงับร้าน', true]],
      suspended: [['approved', 'เปิดร้านอีกครั้ง', false]],
      pending: [['rejected', 'ปฏิเสธ', true], ['approved', 'อนุมัติ', false]],
      rejected: [['approved', 'อนุมัติ', false]],
    };
    let stores = [];
    let filter = '';

    // แสดงรายการร้าน
    function render() {
      const q = document.getElementById('search').value.trim().toLowerCase();
      const list = stores.filter((s) =>
        (!filter || s.status === filter) &&
        (!q || s.name.toLowerCase().includes(q) || s.owner_name.toLowerCase().includes(q) || s.owner_email.toLowerCase().includes(q)));

      document.getElementById('list').innerHTML = list.length
        ? list.map((s) => `
            <div class="admin-store">
              <div class="admin-store__img">${s.image_url ? `<img src="${escapeHtml(s.image_url)}" alt="">` : '🍽️'}</div>
              <div style="min-width:0">
                <div class="row" style="gap:8px;flex-wrap:wrap">
                  <span class="bold">${escapeHtml(s.name)}</span>
                  ${STATUS_PILLS[s.status] || ''}
                  ${s.status === 'approved' && !s.is_accepting ? '<span class="pill pill--completed">ปิดรับชั่วคราว</span>' : ''}
                </div>
                <div class="small mt-4">${icon('user', 'icon-sm')} ${escapeHtml(s.owner_name)} · ${escapeHtml(s.owner_email)}${s.owner_phone ? ` · ${escapeHtml(s.owner_phone)}` : ''}</div>
                <div class="small muted">เวลา ${escapeHtml(s.open_time)}–${escapeHtml(s.close_time)} น. · เมนู ${s.menu_count} รายการ · ออเดอร์ค้าง ${s.active_orders} · เข้าร่วม ${escapeHtml(formatDateTime(s.created_at))}</div>
              </div>
              <div class="row admin-store__actions" style="gap:8px">
                ${(ACTIONS[s.status] || []).map(([next, label, danger]) =>
                  `<button class="btn btn--sm ${danger ? 'btn--ghost text-red' : 'btn--green'}" data-id="${s.id}" data-next="${next}">${label}</button>`).join('')}
              </div>
            </div>`).join('')
        : '<p class="small muted">ไม่พบร้านค้า</p>';
    }

    // โหลดร้านทั้งหมด
    async function load() {
      try {
        stores = await apiRequest('/admin/stores', { auth: true });
        render();
      } catch (err) {
        toast(err.message, 'error');
      }
    }

    // ข้อความยืนยันก่อนเปลี่ยนสถานะร้าน
    function confirmText(store, next) {
      if (next === 'suspended') {
        return {
          title: `ระงับร้าน ${store.name}?`,
          message: store.active_orders
            ? `ร้านจะหายจากหน้าแรกและเข้าใช้งานไม่ได้ ออเดอร์ที่ค้างอยู่ ${store.active_orders} รายการจะถูกยกเลิกและคืนเงินให้ลูกค้า`
            : 'ร้านจะหายจากหน้าแรกและเข้าใช้งานไม่ได้ จนกว่าจะเปิดอีกครั้ง',
          confirmText: 'ระงับร้าน',
          danger: true,
        };
      }
      if (next === 'rejected') return { title: `ปฏิเสธร้าน ${store.name}?`, message: 'ร้านนี้จะใช้งานไม่ได้', confirmText: 'ปฏิเสธ', danger: true };
      return { title: `เปิดร้าน ${store.name}?`, message: 'ร้านจะกลับมาแสดงในหน้าแรกและรับออเดอร์ได้', confirmText: 'เปิดร้าน' };
    }

    document.getElementById('list').addEventListener('click', async (e) => {
      const btn = e.target.closest('[data-next]');
      if (!btn) return;
      const store = stores.find((s) => s.id === Number(btn.dataset.id));
      const next = btn.dataset.next;
      if (!(await confirmDialog(confirmText(store, next)))) return;
      try {
        const res = await apiRequest(`/admin/stores/${store.id}/status`, { method: 'PATCH', auth: true, body: { status: next } });
        toast(next === 'suspended'
          ? `ระงับร้าน ${store.name} แล้ว${res.closed_orders ? ` · ยกเลิกออเดอร์ ${res.closed_orders} รายการ` : ''}`
          : next === 'rejected' ? `ปฏิเสธร้าน ${store.name} แล้ว` : `เปิดร้าน ${store.name} แล้ว`);
      } catch (err) {
        toast(err.message, 'error');
      }
      load();
    });

    document.getElementById('filters').addEventListener('click', (e) => {
      const chip = e.target.closest('[data-status]');
      if (!chip) return;
      filter = chip.dataset.status;
      document.querySelectorAll('#filters .chip').forEach((c) => c.classList.toggle('active', c === chip));
      render();
    });
    document.getElementById('search').addEventListener('input', render);

    if (admin) load();
  </script>
</body>
</html>
